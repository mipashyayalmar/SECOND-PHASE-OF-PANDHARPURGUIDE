<div class="table-responsive">
    <table class="table table-bordered table-hover">
        <!-- Table content remains the same as your original -->
        <!-- ... -->
    </table>
</div>

<!-- Overlay for popup background -->
<div class="popup-overlay" style="display: none;"></div>

<!-- Popup Container -->
<div class="booking-popup-container" style="display: none;">
    <div class="booking-popup">
        <span class="close-btn">&times;</span>
        <h3>Booking Details</h3>
        
        <div class="popup-grid">
            <div class="popup-section">
                <h4><i class="fas fa-user"></i> Guest Information</h4>
                <div class="info-row">
                    <span class="info-label">Guest:</span>
                    <span class="info-value" id="popup-guest"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Room:</span>
                    <span class="info-value" id="popup-room"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Hotel:</span>
                    <span class="info-value" id="popup-hotel"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Booking Type:</span>
                    <span class="info-value" id="popup-booking-type"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Booking Date:</span>
                    <span class="info-value" id="popup-booking-date"></span>
                </div>
            </div>
            
            <div class="popup-section">
                <h4><i class="fas fa-calendar-alt"></i> Stay Details</h4>
                <div class="info-row">
                    <span class="info-label">Check-in:</span>
                    <span class="info-value" id="popup-checkin"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Check-out:</span>
                    <span class="info-value" id="popup-checkout"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Dates:</span>
                    <span class="info-value" id="popup-date-range"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Nights:</span>
                    <span class="info-value" id="popup-nights"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Guests:</span>
                    <span class="info-value" id="popup-guests"></span>
                </div>
            </div>
        </div>
        
        <div class="popup-section">
            <h4><i class="fas fa-file-invoice-dollar"></i> GST Information</h4>
            <div class="info-row">
                <span class="info-label">GST Status:</span>
                <span class="info-value" id="popup-gst-status"></span>
            </div>
            <div class="info-row">
                <span class="info-label">GST Number:</span>
                <span class="info-value" id="popup-gst-number"></span>
            </div>
        </div>
        
        <div class="popup-section price-section">
            <h4><i class="fas fa-receipt"></i> Price Breakdown</h4>
            <div class="price-row">
                <span class="price-label">Base Price:</span>
                <span class="price-value" id="popup-base-price"></span>
            </div>
            <div class="price-row" id="popup-extra-guests-row">
                <!-- Filled dynamically -->
            </div>
            <div class="price-row" id="popup-gst-row">
                <!-- Filled dynamically -->
            </div>
            <div class="price-total">
                <span class="price-label">Total Amount:</span>
                <span class="price-value" id="popup-total-price"></span>
            </div>
        </div>
        
        <div class="popup-actions">
            <button class="btn btn-print">
                <i class="fas fa-print"></i> Print Invoice
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Show booking popup
        function showBookingPopup(bookingData) {
            // Set overlay and popup container to display
            document.querySelector('.popup-overlay').style.display = 'block';
            document.querySelector('.booking-popup-container').style.display = 'block';
            
            // Populate data
            document.getElementById('popup-guest').textContent = bookingData.guest;
            document.getElementById('popup-room').textContent = bookingData.room;
            document.getElementById('popup-hotel').textContent = bookingData.hotel;
            document.getElementById('popup-booking-type').textContent = 
                bookingData.is_direct_booking ? 'Direct Booking' : 'Online Booking';
            document.getElementById('popup-booking-date').textContent = bookingData.booking_date;
            document.getElementById('popup-checkin').textContent = bookingData.check_in;
            document.getElementById('popup-checkout').textContent = bookingData.check_out;
            document.getElementById('popup-date-range').textContent = 
                bookingData.check_in.split(' ')[1] + ' - ' + bookingData.check_out.split(' ')[1];
            document.getElementById('popup-nights').textContent = 
                bookingData.nights + ' night' + (bookingData.nights != 1 ? 's' : '');
            document.getElementById('popup-guests').textContent = 
                bookingData.total_guests + (bookingData.extra_persons > 0 ? 
                ' (+' + bookingData.extra_persons + ' extra)' : '');
            document.getElementById('popup-gst-status').textContent = bookingData.gst_status;
            document.getElementById('popup-gst-number').textContent = bookingData.gst_number || 'N/A';
            document.getElementById('popup-base-price').textContent = 
                '₹' + parseFloat(bookingData.base_amount).toFixed(2);
            document.getElementById('popup-total-price').textContent = 
                '₹' + parseFloat(bookingData.total_amount).toFixed(2);
            
            // Handle extra guests row
            const extraGuestsRow = document.getElementById('popup-extra-guests-row');
            if (bookingData.extra_persons > 0) {
                extraGuestsRow.innerHTML = `
                    <span class="price-label">Extra Guests (${bookingData.extra_persons} × ${bookingData.nights} × ₹${parseFloat(bookingData.extra_guest_charge).toFixed(2)}):</span>
                    <span class="price-value">₹${parseFloat(bookingData.extra_guest_charges).toFixed(2)}</span>
                `;
                extraGuestsRow.style.display = 'flex';
            } else {
                extraGuestsRow.style.display = 'none';
            }
            
            // Handle GST row
            const gstRow = document.getElementById('popup-gst-row');
            if (parseFloat(bookingData.gst_rate) > 0) {
                gstRow.innerHTML = `
                    <span class="price-label">GST (${parseFloat(bookingData.gst_rate).toFixed(2)}%):</span>
                    <span class="price-value">₹${parseFloat(bookingData.gst_amount).toFixed(2)}</span>
                `;
                gstRow.style.display = 'flex';
            } else {
                gstRow.innerHTML = `
                    <span class="price-label">GST:</span>
                    <span class="price-value"><i class="fas fa-times"></i> Not Applied</span>
                `;
                gstRow.style.display = 'flex';
            }
        }
        
        // Close popup
        function closePopup() {
            document.querySelector('.popup-overlay').style.display = 'none';
            document.querySelector('.booking-popup-container').style.display = 'none';
        }
        
        // Event listeners for view buttons
        document.querySelectorAll('.view-booking').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                const bookingData = JSON.parse(this.getAttribute('data-booking'));
                showBookingPopup(bookingData);
            });
        });
        
        // Close button event
        document.querySelector('.close-btn').addEventListener('click', closePopup);
        
        // Overlay click event
        document.querySelector('.popup-overlay').addEventListener('click', closePopup);
        
        // Escape key to close
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePopup();
            }
        });
    });
</script>

    .booking-popup-container {
